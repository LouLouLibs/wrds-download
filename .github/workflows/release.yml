name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: almalinux:8        # glibc 2.28 — matches RHEL 8 HPC clusters
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y gcc gcc-c++ git

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -o wrds-dl-linux-amd64 .

      - uses: actions/upload-artifact@v4
        with:
          name: wrds-dl-linux-amd64
          path: wrds-dl-linux-amd64

  build-macos:
    runs-on: macos-14             # Apple Silicon (arm64) macOS runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -o wrds-dl-darwin-arm64 .

      - uses: actions/upload-artifact@v4
        with:
          name: wrds-dl-darwin-arm64
          path: wrds-dl-darwin-arm64

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wrds-dl-linux-amd64/wrds-dl-linux-amd64
            wrds-dl-darwin-arm64/wrds-dl-darwin-arm64
