[project]
name = "wrds-dl"
version = "0.3.0"
description = "Lightweight CLI for downloading WRDS data to Parquet or CSV"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "pyarrow>=14",
    "click>=8",
]

[project.scripts]
wrds-dl = "wrds_dl.cli:cli"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wrds_dl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 99
